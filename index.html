<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111827">
<title>부산 맛집지도 (유튜버 + 미쉐린)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#111827;background:#f3f4f6;-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
header{background:#111827;color:#fff;padding:10px 12px 8px;z-index:5;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:17px;font-weight:800;letter-spacing:-.3px;flex:1;white-space:nowrap}
h1 small{font-size:11px;font-weight:500;color:#9ca3af;margin-left:6px}
.iconbtn{background:#1f2937;border:1px solid #374151;color:#e5e7eb;border-radius:8px;padding:6px 9px;font-size:12px;cursor:pointer}
#q{flex:1;border:none;border-radius:10px;padding:9px 12px;font-size:14px;background:#fff;color:#111}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;cursor:pointer;border:2px solid var(--c);background:var(--c);color:#fff;user-select:none;transition:.15s}
.chip.off{background:transparent;color:#9ca3af;border-color:#4b5563}
.chip .dot{width:9px;height:9px;border-radius:50%;background:#fff}
.chip.off .dot{background:var(--c)}
.chip .cnt{font-weight:500;opacity:.85;font-size:11px}
#mapwrap{position:relative;flex:1}
#map{position:absolute;inset:0;background:#e5e7eb}
.fab{position:absolute;right:12px;z-index:3;display:flex;flex-direction:column;gap:8px}
.fab button{background:#fff;border:none;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.25);padding:10px 12px;font-size:13px;font-weight:700;color:#111827;cursor:pointer}
.fab button.on{background:#2563eb;color:#fff}
#radius{position:absolute;left:12px;top:12px;z-index:3;background:#fff;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.2);display:none;padding:4px}
#radius button{border:none;background:none;padding:6px 9px;font-size:12px;font-weight:700;border-radius:8px;color:#374151;cursor:pointer}
#radius button.sel{background:#2563eb;color:#fff}
/* bottom sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:46%;transition:max-height .25s}
#sheet.full{max-height:88%}
#sheet.min{max-height:56px}
.handle{padding:8px 14px 6px;cursor:pointer}
.handle .bar{width:40px;height:4px;border-radius:2px;background:#d1d5db;margin:0 auto 6px}
.handle .t{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;color:#374151}
.handle .t span.sub{font-weight:500;color:#6b7280;font-size:12px}
#list{overflow-y:auto;padding:0 10px 14px;-webkit-overflow-scrolling:touch}
.item{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid #f1f5f9;cursor:pointer}
.item:active{background:#f9fafb}
.item img{width:84px;height:48px;object-fit:cover;border-radius:6px;flex:0 0 auto;background:#e5e7eb}
.item .b{flex:1;min-width:0}
.item .nm{font-size:14.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .mm{font-size:12.5px;color:#374151;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:11.5px;color:#6b7280;margin-top:3px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;color:#fff;background:var(--c)}
.dist{font-weight:800;color:#2563eb}
.warn{color:#b45309;font-weight:700}
/* detail */
#detail{position:absolute;inset:0;z-index:6;background:#fff;transform:translateY(100%);transition:transform .25s;display:flex;flex-direction:column}
#detail.open{transform:none}
#detail .top{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid #e5e7eb}
#detail .top button{border:none;background:#f3f4f6;border-radius:8px;padding:7px 11px;font-size:13px;font-weight:700;cursor:pointer}
#detail .top .ttl{flex:1;font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dbody{overflow-y:auto;padding:14px 16px 30px;-webkit-overflow-scrolling:touch}
.dn{font-size:22px;font-weight:900;letter-spacing:-.5px}
.dcat{font-size:12.5px;color:#6b7280;margin-top:3px}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sec{margin-top:18px}
.sec h3{font-size:13px;font-weight:800;color:#6b7280;margin-bottom:8px;letter-spacing:.2px}
.mainmenu{background:#fef3c7;border-radius:10px;padding:10px 12px;font-size:15px;font-weight:800;color:#78350f}
table.menu{width:100%;border-collapse:collapse;font-size:14px}
table.menu td{padding:7px 2px;border-bottom:1px dashed #e5e7eb}
table.menu td.p{text-align:right;font-weight:700;white-space:nowrap;color:#111827}
.info{display:grid;grid-template-columns:64px 1fr;gap:7px 10px;font-size:13.5px}
.info .k{color:#6b7280;font-weight:700}
.info a{color:#2563eb;text-decoration:none}
.vcard{border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;margin-bottom:12px}
.vcard a.thumb{display:block;position:relative}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#e5e7eb}
.vcard .play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:56px;height:40px;background:rgba(220,38,38,.92);border-radius:10px;display:flex;align-items:center;justify-content:center}
.vcard .play:after{content:"";border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.vcard .vb{padding:10px 12px}
.vcard .vt{font-size:13.5px;font-weight:800;line-height:1.35}
.vcard .vm{font-size:11.5px;color:#6b7280;margin:4px 0 6px;display:flex;gap:6px;align-items:center}
.vcard .vi{font-size:13.5px;line-height:1.55;color:#1f2937}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.links a{display:block;text-align:center;padding:10px 4px;border-radius:10px;font-size:12.5px;font-weight:800;text-decoration:none;color:#fff}
.note{font-size:11.5px;color:#9ca3af;margin-top:16px;line-height:1.5}
/* modal */
#modal{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:20px}
#modal .box{background:#fff;border-radius:14px;padding:18px;max-width:420px;width:100%}
#modal h2{font-size:16px;margin-bottom:8px}
#modal p{font-size:12.5px;color:#4b5563;line-height:1.55;margin-bottom:10px}
#modal input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:13px}
#modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
#modal .acts button{border:none;border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.toast{position:fixed;left:50%;bottom:50%;transform:translateX(-50%);background:rgba(17,24,39,.92);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:10;display:none}
@media(min-width:900px){
  #sheet{left:12px;right:auto;width:400px;bottom:12px;top:12px;max-height:none!important;border-radius:14px}
  #sheet .handle .bar{display:none}
  #detail{left:auto;width:440px;box-shadow:-4px 0 16px rgba(0,0,0,.15);transform:translateX(100%)}
  #detail.open{transform:none}
  #radius{left:424px}
}
.chipsep{flex:0 0 auto;align-self:center;color:#9ca3af;font-size:11px;font-weight:700;padding:0 2px 0 6px;border-left:1px solid #374151;margin-left:2px}
.msym{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#fff;color:var(--c);font-size:10px;font-weight:900}
.chip.off .msym{background:var(--c);color:#fff}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <h1>부산 맛집지도<small id="total"></small></h1>
      
    </div>
    <div class="row" style="margin-top:8px"><input id="q" type="search" placeholder="식당·메뉴·동네 검색 (예: 돼지국밥, 서면, 미쉐린)"></div>
    <div class="chips" id="chips"></div>
  </header>
  <div id="mapwrap">
    <div id="map"></div>
    <div id="radius"></div>
    <div class="fab" style="top:12px">
      <button id="nearBtn">내 주변</button>
      <button id="fitBtn">전체보기</button>
    </div>
    <div id="sheet">
      <div class="handle" id="handle"><div class="bar"></div><div class="t"><span id="ltitle">목록</span><span class="sub" id="lsub"></span></div></div>
      <div id="list"></div>
    </div>
    <div id="detail"><div class="top"><button id="backBtn">닫기</button><div class="ttl" id="dttl"></div></div><div id="dbody"></div></div>
  </div>
</div>
<div class="toast" id="toast"></div>

ttps://prod-pics.guide.michelin.com/api/public/content/3d529c22623e4c24b711c749ed0cef82.jpg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10010,"src":"mic","g":"sel","green":false,"n":"해운대 암소갈비집","a":"부산 해운대구 해운대해변로 333","lat":35.16324,"lon":129.16629,"cat":"바비큐","pr":"₩₩","ph":"051-746-0033","h":"월요일 11:30-14:00 화요일 11:30-14:00 수요일 11:30-14:00 목요일 11:30-14:00 금요일 11:30-14:00 토요일 11:30-14:00 일요일 11:30-14:00","good":"가족 모두 즐길 수 있는","desc":"1964년부터 한 자리를 한결같이 지켜온 부산의 명물. 100년 넘은 고택에서 현대적인 건물로 탈바꿈한 해운대 암소갈비집은 3대째 이어져 온 이곳은 이름에서 알 수 있듯 암소의 갈비와 불고기만을 내는 곳으로 그 역사와 전통을 자랑한다. 꽃갈비만 사용하는 생갈비와 은은하면서도 자꾸만 당기는 맛의 양념갈비가 있는데, 생갈비는 수량이 정해져 있어 점심이 지나면 거의 품절되는 일이 다반사다. 쫄깃한 감자면 사리와 구수한 갈빗대가 들어간 뚝배기 된장을 함께 먹어볼 것. 살살 녹는 갈비와 함께 입이 즐거울 것이다. 주말 및 성수기에는 대기 시간이 다소 길어질 수 있고 생갈비는 방문 1주일전 미리예약이 가능하다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/haeundae-rib-barbecue-restaurant","img":"https://prod-pics.guide.michelin.com/api/public/content/0427de67dd0c4d13b0c38a00c05d4fcc.jpeg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10011,"src":"mic","g":"sel","green":false,"n":"차오란","a":"부산 해운대구 달맞이길 30, 시그니엘 부산 5층","lat":35.16021,"lon":129.16988,"cat":"중식","pr":"₩₩₩","ph":"051-922-1250","h":"월요일 12:00-15:00 화요일 12:00-15:00 수요일 12:00-15:00 목요일 12:00-15:00 금요일 12:00-15:00 토요일 12:00-15:00 일요일 12:00-15:00","good":"가족 모두 즐길 수 있는","desc":"시그니엘 5층에 위치한 차오란. 정통 광둥식 음식을 내는 중식당으로 정확히는 홍콩식에 가깝다. 홍콩식은 광둥식을 기반으로 하면서도 다양한 문화를 가진 지역의 특색이 만들어 낸 새로운 맛들이 조화롭게 섞인 것이 특징이다. 딤섬만 하더라도 오징어 먹물로 색을 낸 만두피에 금박을 올린 하가우, 트러플을 비롯한 각종 버섯과 아스파라거스를 넣은 야채교자, 말린 가리비와 XO 소스를 넣고 날치알을 올린 딤섬 등 화려하고 맛있는 메뉴가 다양하게 준비되어 있다. 대표 메뉴인 꿀 소스 바베큐와 바삭한 크리스피 삼겹살은 촉촉한 고기에 바삭한 껍질과 과하지 않은 양념 맛이 일품이다. 1920년대 홍콩을 재연한 듯한 실내에서 해운대를 조망하며 음식을 음미해 보기를 바란다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/chaoran","img":"https://prod-pics.guide.michelin.com/api/public/content/9bdd8500a7394638b0fee0133d13fb3a.png?format=jpeg&w=400&h=400","resv":"Yes","yt":[]},{"i":10012,"src":"mic","g":"sel","green":false,"n":"딤타오","a":"부산 해운대구 우동 1로 25","lat":35.16394,"lon":129.15647,"cat":"딤섬","pr":"₩₩","ph":"051-741-3638","h":"월요일 11:30-15:00 화요일 휴무 수요일 11:30-15:00 목요일 11:30-15:00 금요일 11:30-15:00 토요일 11:30-15:00 일요일 11:30-15:00","good":"여럿이 함께 즐기기 좋은 곳","desc":"‘마음에 점을 찍다’라는 의미의 딤섬은 중국 광둥 지역의 대표 음식이다. 배를 가득 채우기 위함이 아닌 간소하게 먹는 음식이라는 뜻이 담겨 있다. 딤섬은 종류가 무수히 많지만 딤타오에서는 그 중 가장 유명한 몇 가지를 선보인다. 육즙이 가득한 샤오롱바오, 통통한 새우살과 부추를 듬뿍 채운 교자를 비롯해 원톤수프나 바베큐번 등도 만나볼 수 있다. 예로부터 딤섬은 차와 함께 먹었다고 하니 보이차나 재스민차와 곁들여 먹어 보기를 추천한다. 해리단길에서 긴 줄을 찾다 보면 금세 발견할 수 있다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/dim-tao","img":"https://prod-pics.guide.michelin.com/api/public/content/78eeee46c4cf4ae7a9d916dde9c27668.jpeg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10013,"src":"mic","g":"sel","green":false,"n":"양경옥","a":"부산 수영구 민락본동로 31번길 16","lat":35.1595177,"lon":129.1275759,"cat":"냉면","pr":"₩","ph":"010-9937-4997","h":"","good":"현지인처럼 즐기는 맛집 탐방","desc":"밝을 ‘양’, 빛날 ‘경’, 집 ‘옥’ 자를 써서 ‘밝게 빛나는 집’을 뜻하는 양경옥은 직접 뽑은 면과 감칠맛 나는 육수로 이름난 평양냉면집이다. 옛날 주택을 개조하고 주방을 널찍하게 조성해 청결한 환경을 한눈에 확인할 수 있다. 주문과 동시에 면을 뽑아 식감이 더욱 쫄깃하고 부드럽다. 고소한 육향과 메밀향, 슴슴한 육수에 쫄깃한 고기와 탄력 있는 국수의 밸런스가 좋고 상큼한 배추와 무가 감칠맛을 돋운다. 불고기와 편육도 곁들일 수 있으니 함께 즐겨 보시기를 바란다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/yangkyungoak","img":"https://prod-pics.guide.michelin.com/api/public/content/e3bb6f04ba7542c887ffc2a04609c451.jpeg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10014,"src":"mic","g":"bib","green":false,"n":"슌사이 쿠보","a":"부산 북구 양달로 4번길 17","lat":35.24088,"lon":129.01472,"cat":"장어","pr":"₩","ph":"051-365-2959","h":"월요일 11:30-15:00 화요일 11:30-15:00 수요일 11:30-15:00 목요일 11:30-15:00 금요일 11:30-15:00 토요일 11:30-15:00 일요일 11:30-15:00","good":"가족 모두 즐길 수 있는","desc":"슌사이 쿠보는 히츠마부시 전문점이다. 일본에서 수련한 셰프는 히츠마부시의 맛과 품질을 자신이 추구하는 명확한 기준까지 끌어올리기 위해 정진하고 있다. 정성껏 소스를 발라 구운 장어의 그윽한 향과 씹는 맛을 살린 식감이 고슬고슬 잘 지어진 밥과 어우러져 조화로운 맛을 준다. 어린이용 장어 덮밥도 준비하여 아이를 동반한 가족 손님에 대한 배려도 잊지 않았다. 또한 과거 슌사이 쿠보의 갓포 요리를 기억 g?format=jpeg&w=400&h=400","resv":"Yes","yt":[]},{"i":10022,"src":"mic","g":"bib","green":false,"n":"동경밥상","a":"부산 수영구 남천바다로 34-6","lat":35.14839,"lon":129.11386,"cat":"장어","pr":"₩","ph":"070-7576-1428","h":"월요일 11:30-21:00 화요일 11:30-21:00 수요일 11:30-21:00 목요일 11:30-21:00 금요일 11:30-21:00 토요일 11:30-21:00 일요일 11:30-15:00","good":"가족 모두 즐길 수 있는","desc":"부산의 정취가 돋보이는 광안리 해수욕장의 익숙한 거리 분위기에서 벗어나 레스토랑의 정문에 이르면 사뭇 차분하고 정적인 분위기가 감돈다. 일본의 대표적인 장어 덮밥인 우나쥬와 히츠마부시를 선보이는 동경 밥상의 모습이다. 김태우 셰프의 손을 거친 동경 밥상의 음식에서 이 요리의 정통성을 표현하고자 하는 그의 노력이 엿보인다. 두툼하게 씹히는 우나기는 본연의 풍미가 도드라지고 감칠맛 나는 소스와 잘 어우러진다. 무엇보다 최근 도정을 원칙으로 하는 윤기 나는 쌀밥과의 조화가 입맛을 당긴다. 정통성 있는 레시피를 존중하며 디테일하게 자신만의 맛을 더해가는 모습이 요리에 대한 신뢰로 이어진다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/tokyo-babsang","img":"https://prod-pics.guide.michelin.com/api/public/content/48fc3bc0a2134e51a10a54cc93160e72.jpeg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10023,"src":"mic","g":"bib","green":false,"n":"코르 파스타바","a":"부산 진구 동성로 25번길 13, 2층","lat":35.15264,"lon":129.06769,"cat":"이탤리언","pr":"₩","ph":"010-2366-4570","h":"월요일 휴무 화요일 12:00-14:30 수요일 12:00-14:30 목요일 12:00-14:30 금요일 12:00-14:30 토요일 12:00-14:30 일요일 12:00-14:30","good":"혼자서도 편하게 즐기는 혼밥 맛집","desc":"부산 전포동의 힙한 골목길 2층. 레스토랑 문을 열면 개방된 주방에서 분주히 움직이는 셰프들과 10석 남짓한 카운터 테이블이 눈에 들어온다. ‘코르 파스타 바‘라는 이름처럼 이곳에는 직접 제면한 파스타를 다양하게 선보인다. 진한 비스크 풍미의 스파게티, 이탈리아 어란이 들어간 보타르가 파스타, 한우를 사용한 라구까지 클래식 이탤리언 테이스트를 지향하는 셰프의 메뉴를 즐길 수 있다. 1인 1주류 주문이 필수이니 파스타와 함께 합리적인 가격대의 와인도 음미해 보시길.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/cor-pasta-bar","img":"https://prod-pics.guide.michelin.com/api/public/content/a3d4ae03b2c74a3880174f824289ac10.jpeg?format=jpeg&w=400&h=400","resv":"Yes","yt":[]},{"i":10024,"src":"mic","g":"sel","green":false,"n":"굿모닝홍콩","a":"부산 진구 서전로 47번길 19","lat":35.15875,"lon":129.06444,"cat":"중식","pr":"₩₩","ph":"010-6444-3724","h":"월요일 11:30-18:00 화요일 12:00-21:00 수요일 12:00-21:00 목요일 12:00-21:00 금요일 12:00-21:00 토요일 11:30-17:00 일요일 11:30-17:00","good":"여럿이 함께 즐기기 좋은 곳","desc":"홍콩 음식이 그립다면, 홍콩의 바이브를 느껴 보고 싶다면 차찬텡 컨셉의 이곳을 주목하자. 그저 홍콩이 좋아 오픈했다는 오너는 정통 홍콩식보다는 한국인의 입맛에 맞게 약간 변형시킨 음식을 제공한다. 그럼에도 그 맛이나 비주얼만큼은 현지 음식에 뒤지지 않는다. 토마토와 햄이 듬뿍 들어간 칼칼한 토마토 국수를 비롯해 연유와 시럽을 아낌 없이 넣은 빵, 달달한 밀크티인 나이차나 레몬 홍차인 똥랭차 등을 맛볼 수 있다. 홍콩스러운 비주얼은 덤이다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/good-morning-hongkong","img":"https://prod-pics.guide.michelin.com/api/public/content/f8aa46be255c4f3e94a7f1e62782dccf.jpeg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10025,"src":"mic","g":"star","green":false,"n":"모리","a":"부산 해운대구 구남로 21, 경동리인뷰 2차 상가 3층 311호","lat":35.163577,"lon":129.161301,"cat":"일식","pr":"₩₩₩","ph":"051-731-9889","h":"월요일 휴무 화요일 19:00-22:00 수요일 19:00-22:00 목요일 19:00-00:00 금요일 19:00-22:00 토요일 17:00-22:00 일요일 17:00-22:00","good":"셰프와 함께하는 다이닝 데이트 나잇","desc":"일본에서 수학한 셰프와 그의 일본인 아내가 함께 운영하는 모리. 정갈한 정통 가이세키 요리를 즐길 수 있는 곳으로, 눈과 입이 모두 즐거운 곳이다. 부산의 신선한 해산물과 제철 채소를 이용해 섬세한 요리를 만들어 내는 김완규 셰프는 식재료의 조화와 코스의 리듬감을 잘 조절하는 균형 감각이 탁월하다. 아내의 세심하고 유려한 서비스와 셰프의 정성스런 요리를 맛볼 수 있는 따뜻한 공간에서 정통 일식을 즐겨 보시길 바란다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/mori","img":"https://prod-pics.guide.michelin.com/api/public/content/228b80fb95ed40bd9f8763e0b1db8927.jpeg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10026,"src":"mic","g":"sel","green":false,"n":"차애전 할매 칼국수","a":"부산 연제구 과정로 191번가길 70","lat":35.18716,"lon":129.10249,"cat":"칼국수","pr":"₩","ph":"051-751-9639","h":"월요일 09:00-15:30 화요일 09:00-15:30 수요일 09:00-15:30 목요일 09:00-15:30 금요일 09:00-15:30 토요일 09:00-15:30 일요일 휴무","good":"가족 모두 즐길 수 있는","desc":"차애전 할매 칼국수는 1982년 개업 이후 변함없는 꾸준함을 무기로 오랜 시간 지역민들에게 소박하고 따뜻한 칼국수를 제공해왔다. 어디서든 쉽게 접할 수 있는 칼국수이지만 이곳의 칼국수는 소박함에서 나오는 옛스러운 스타일이 눈에 띈다. 걸쭉한 국물과는 달리 마일드하고 라이트한 맛, 김치 대신 나오는 독특하고 매콤한 맛의 김치양파 다대기 등 이곳만의 특징적 요소들이 있다. 처음에는 다대기를 풀지 말고 슴슴한 국물과 면을 즐긴 다음 국물에 다대기를 풀어 먹으면 얼큰함이 잔잔하게 올라온다. 이 밖에도 할매칼국수와 비빔칼국수, 여름에만 판매하는 맷돌콩칼국수 등 칼국수의 여러 변형된 메뉴를 즐길 수 있다. 칼국수 양을 고를 수 있어 식사량에 따라 합리적으로 선택도 가  현지의 골목 식당을 그대로 옮겨 놓은 듯한 이국적인 모습이 시선을 사로잡는다. 피리피리에서는 태국 고유의 맛을 바탕으로 로컬의 입맛에 맞게 재해석된 태국 요리를 맛볼 수 있다. 대표 메뉴인 푸팟퐁 커리는 부드러운 게살과 풍미 가득한 커리 소스가 조화를 이루어 흰밥에 곁들이기 좋다. 자극적인 신맛과 매콤함이 어우러진 똠얌 수프도 일품이지만 이 똠얌이 들어간 복음밥 카오팟 똠얌 또한 별미다. 의도한 듯 올드한 인테리어는 태국 현지의 다이닝 분위기를 잘 표현했다. 감각적인 공간에서 즐기는 태국 요리와 칵테일 한 잔이 마치 현지에 있는 듯한 즐거움을 선사한다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/pili-pili","img":"https://prod-pics.guide.michelin.com/api/public/content/4915f2f049cd4534ab03a32ae2cf07b2.jpg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10030,"src":"mic","g":"sel","green":false,"n":"나막집","a":"부산 남구 분포로 145, W 스퀘어 A동 1068호","lat":35.13461,"lon":129.11187,"cat":"돼지국밥","pr":"₩","ph":"051-746-4882","h":"","good":"혼자서도 편하게 즐기는 혼밥 맛집","desc":"부산은 돼지 국밥의 도시답게 국밥의 스타일도 다양하다. 돼지 국밥 고유의 맛은 유지하면서도 가게마다 국물을 내는 방식을 조금씩 달리하는 점이 특징이다. 나막집은 고기 육수에서 채수의 비율을 높여 진득한 맛보다는 가벼우면서도 깔끔한 국물 맛을 즐길 수 있다. 주메뉴인 돼지 국밥 외에 국밥 육수를 사용한 고기칼국수와 생면칼국수, 수육과 삼겹구이 등 부대 메뉴도 선택이 가능하다. 모던한 느낌의 공간에서 뒷맛이 깔끔한 돼지 국밥을 즐기기에 안성맞춤이다.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/namakzip","img":"https://prod-pics.guide.michelin.com/api/public/content/da86993d13bf4cbaa4a604dc300c4219.jpg?format=jpeg&w=400&h=400","resv":"No","yt":[]},{"i":10031,"src":"mic","g":"sel","green":false,"n":"언양불고기 부산집","a":"부산 수영구 남천바다로 32","lat":35.14788,"lon":129.11357,"cat":"불고기","pr":"₩₩","ph":"051-754-1004","h":"월요일 11:00-21:30 화요일 11:00-21:30 수요일 11:00-21:30 목요일 11:00-21:30 금요일 11:00-21:30 토요일 11:00-21:30 일요일 11:00-21:30","good":"가족 모두 즐길 수 있는","desc":"흔히 부산집으로 불리는 이곳은 오랜 시간 광안리 앞을 지켜 온 터줏대감으로 늘 문전성시를 이룬다. 수십 년을 운영하던 곳을 떠나 2018년에 지금의 위치로 이전했다. 육수를 넣고 자작하게 끓여 내는 서울식 불고기와는 달리 언양식은 양념한 고기를 석쇠에 올려 굽거나 직화 구이 방식을 이용한다. 서울식이 달달한 맛이라면 언양식은 단맛이 적고 한우 등심의 고소한 맛을 더 강조하며 소스에서 나오는 산미가 상큼함을 더한다. 부산집에서는 불고기 외에 다양한 특수 부위도 맛볼 수 있다. 오늘은 광안리 앞바다를 보면서 흰밥에 고기 한 점 드셔 보시길.","url":"https://guide.michelin.com/kr/ko/busan-region/busan_1025838/restaurant/eonyang-bulgogi-busanjip","img":"https://prod-pics.guide.micheli }

function buildChips(){
  const box=$("#chips"); box.innerHTML="";
  for (const k of ORDER){
    const n = YDATA.filter(d => chOf(d).includes(k)).length;
    const el=document.createElement("div"); el.className="chip"+(state.on.has(k)?"":" off"); el.style.setProperty("--c",CH[k].color);
    el.innerHTML=`<span class="dot"></span>${esc(CH[k].name)}<span class="cnt">${n}</span>`;
    el.onclick=()=>{ state.on.has(k)?state.on.delete(k):state.on.add(k); localStorage.setItem("bmz_on",JSON.stringify([...state.on])); buildChips(); refresh(); };
    box.appendChild(el);
  }
  const sep=document.createElement("div"); sep.className="chipsep"; sep.textContent="미쉐린"; box.appendChild(sep);
  for (const g of MORDER){
    const n = MDATA.filter(d => d.g === g).length;
    const el=document.createElement("div"); el.className="chip mchip"+(state.mon.has(g)?"":" off"); el.style.setProperty("--c",MG[g].color);
    el.innerHTML=`<span class="msym">${MG[g].sym}</span>${esc(MG[g].short)}<span class="cnt">${n}</span>`;
    el.onclick=()=>{ state.mon.has(g)?state.mon.delete(g):state.mon.add(g); localStorage.setItem("bmz_mon",JSON.stringify([...state.mon])); buildChips(); refresh(); };
    box.appendChild(el);
  }
}

function micSvg(d){
  const c = MG[d.g].color, s = MG[d.g].sym;
  const ring = d.green ? `<circle cx="16" cy="16" r="15" fill="none" stroke="#2f9e44" stroke-width="2.5"/>` : "";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><circle cx="16" cy="16" r="12.5" fill="${c}" stroke="#fff" stroke-width="2.5"/>${ring}<text x="16" y="${s==='★'?21.5:20.5}" text-anchor="middle" font-family="Arial,sans-serif" font-weight="900" font-size="${s==='★'?15:13}" fill="#fff">${s}</text></svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}
function pinSvg(d){
  const cs = chOf(d).map(c => CH[c].color);
  const approx = d.geo === "approx";
  const defs = cs.length > 1 ? `<defs><linearGradient id="g" x1="0" x2="1"><stop offset="50%" stop-color="${cs[0]}"/><stop offset="50%" stop-color="${cs[1]}"/></linearGradient></defs>` : "";
  const f = cs.length > 1 ? "url(#g)" : (approx ? "#ffffff" : cs[0]);
  const stroke = approx ? cs[0] : "#ffffff";
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="38" viewBox="0 0 28 38">${defs}<path d="M14 1C7 1 1.5 6.5 1.5 13.3c0 9 12.5 23.2 12.5 23.2s12.5-14.2 12.5-23.2C26.5 6.5 21 1 14 1z" fill="${f}" stroke="${stroke}" stroke-width="2.4" ${approx?'stroke-dasharray="3 2"':''}/><circle cx="14" cy="13.3" r="4.6" fill="${approx?cs[0]:'#fff'}"/></svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}
function meSvg(){
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"><circle cx="12" cy="12" r="9" fill="#2563eb" stroke="#fff" stroke-width="3"/></svg>`;
  return "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg);
}

function initMap(){
  map = new kakao.maps.Map($("#map"), { center: LL(35.16, 129.06), level: 8 });
  map.addControl(new kakao.maps.ZoomControl(), kakao.maps.ControlPosition.RIGHT);
  const size = new kakao.maps.Size(28,38), opt = { offset: new kakao.maps.Point(14,37) };
  const msize = new kakao.maps.Size(32,32), mopt = { offset: new kakao.maps.Point(16,16) };
  for (const d of DATA){
    if (d.lat == null) continue;
    const isM = d.src === "mic";
    const m = new kakao.maps.Marker({ position: LL(d.lat,d.lon), title: d.n, zIndex: isM ? (d.g==="star"?30:20) : 10, image: isM ? new kakao.maps.MarkerImage(micSvg(d), msize, mopt) : new kakao.maps.MarkerImage(pinSvg(d), size, opt) });
    kakao.maps.event.addListener(m, "click", () => openDetail(d.i));
    markers[d.i] = m;
  }
  kakao.maps.event.addListener(map, "idle", () => { if (!state.me || !state.radius) renderList(); });
  window.addEventListener("resize", () => map && map.relayout());
  refresh();
  fitAll();
}

function visible(){ return DATA.filter(match); }
function refresh(){
  const vis = new Set(visible().map(d => d.i));
  if (map) for (const d of DATA){ const m = markers[d.i]; if (!m) continue; const want = vis.has(d.i); if (want !== !!m._on){ m.setMap(want ? map : null); m._on = want; } }
  $("#total").textContent = `${vis.size}곳`;
  renderList();
}
function fitAll(){
  if (!map) return;
  const b = new kakao.maps.LatLngBounds(); let n=0;
  for (const d of visible()) if (d.lat && d.lat>34.95 && d.lat<35.40 && d.lon>128.80 && d.lon<129.32) { b.extend(LL(d.lat,d.lon)); n++; }
  if (!n) for (const d of visible()) if (d.lat) { b.extend(LL(d.lat,d.lon)); n++; }
  if (n) map.setBounds(b, 40, 40, 40, 40);
}

function shortArea(d){ const s=(d.ar||d.a||"").replace(/\(.*?\)/g,"").replace(/^부산(광역시)?\s*/,""); return s.split(/\s+/).slice(0,2).join(" "); }
function renderList(){
  let arr = visible();
  let title;
  if (state.me){
    arr.forEach(d => d._d = d.lat ? hav(state.me.lat,state.me.lon,d.lat,d.lon) : Infinity);
    arr.sort((a,b) => a._d - b._d);
    if (!state.radius) arr = arr.slice(0, 100);
    title = state.radius ? `내 주변 ${fmtD(state.radius)} 이내` : "내 위치에서 가까운 순";
  } else if (map && !state.q){
    const bb = map.getBounds();
    const inb = arr.filter(d => d.lat && bb.contain(LL(d.lat,d.lon)));
    arr = inb.length ? inb : arr;
    arr.sort(cmpDefault);
    title = "지도 화면 안의 맛집";
  } else {
    arr.sort(cmpDefault);
    title = state.q ? `"${state.q}" 검색 결과` : "전체 (최신 영상순)";
  }
  $("#ltitle").textContent = title; $("#lsub").textContent = `${arr.length}곳`;
  $("#list").innerHTML = arr.slice(0, 300).map(d => {
    if (d.src === "mic"){
      const dist = state.me && d.lat ? `<span class="dist">${fmtD(d._d)}</span>` : "";
      const yt = (d.yt||[]).length ? `<span class="badge" style="--c:#111827">유튜버 소개</span>` : "";
      return `<div class="item" data-i="${d.i}"><img loading="lazy" src="${esc(d.img)}" alt="" style="object-fit:cover"><div class="b"><div class="nm">${esc(d.n)}</div><div class="mm">${esc(d.cat)} · ${esc(d.pr)}</div><div class="meta">${dist}${mBadge(d.g)}${d.green?`<span class="badge" style="--c:#2f9e44">그린 스타</span>`:""}${yt}<span>${esc(shortArea(d))}</span></div></div></div>`;
    }
    const v = d.v[0];
    const bs = chOf(d).map(c => `<span class="badge" style="--c:${CH[c].color}">${esc(CH[c].name)}</span>`).join("");
    const dist = state.me && d.lat ? `<span class="dist">${fmtD(d._d)}</span>` : "";
    const w = d.geo === "approx" ? `<span class="warn">대략 위치</span>` : (d.geo === "none" ? `<span class="warn">위치 미확인</span>` : "");
    const mb = d.mic ? mBadge(BYI[d.mic].g) : "";
    return `<div class="item" data-i="${d.i}"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt=""><div class="b"><div class="nm">${esc(d.n)}</div><div class="mm">${esc(d.mm || d.cat)}</div><div class="meta">${dist}${bs}${mb}<span>${esc(shortArea(d))}</span>${w}</div></div></div>`;
  }).join("") || `<div style="padding:24px;text-align:center;color:#6b7280;font-size:13px">조건에 맞는 식당이 없습니다.</div>`;
}

function cmpDefault(a,b){
  const ra = a.src==="mic" ? (a.g==="star"?0:a.g==="bib"?1:2) : 3, rb = b.src==="mic" ? (b.g==="star"?0:b.g==="bib"?1:2) : 3;
  if (ra !== rb) return ra - rb;
  if (ra < 3) return a.n.localeCompare(b.n);
  return (b.v[0].d||"").localeCompare(a.v[0].d||"");
}
function kakaoLinks(d){
  const nm = d.n.replace(/\(.*?\)/g,"").trim();
  const q = encodeURIComponent(nm + " " + shortArea(d));
  const route = d.kid ? `https://map.kakao.com/link/to/${d.kid}` : (d.lat ? `https://map.kakao.com/link/to/${encodeURIComponent(nm)},${d.lat},${d.lon}` : `https://map.kakao.com/?q=${q}`);
  return { q, route };
}
function openMic(d){
  $("#dttl").textContent = d.n;
  const dist = state.me && d.lat ? ` · 내 위치에서 ${fmtD(hav(state.me.lat,state.me.lon,d.lat,d.lon))}` : "";
  const rows = [["요리", esc(d.cat)], ["가격대", esc(d.pr) + ' <span style="color:#6b7280;font-size:12px">(₩ 저렴 ~ ₩₩₩₩ 고가)</span>'], ["주소", esc(d.a)], ["전화", d.ph ? `<a href="tel:${esc(d.ph)}">${esc(d.ph)}</a>` : ""], ["영업시간", esc(d.h).replace(/ (?=[월화수목금토일]요일)/g, "<br>")], ["추천 상황", esc(d.good)]].filter(r => r[1]);
  const { q, route } = kakaoLinks(d);
  const yts = (d.yt||[]).map(yi => BYI[yi]).filter(Boolean).map(y => `<div class="item" data-i="${y.i}" style="border:1px solid #e5e7eb;border-radius:10px;padding:8px"><img src="https://i.ytimg.com/vi/${y.v[0].id}/mqdefault.jpg" alt=""><div class="b"><div class="nm">${esc(y.v[0].t)}</div><div class="meta">${chOf(y).map(c => `<span class="badge" style="--c:${CH[c].color}">${esc(CH[c].name)}</span>`).join("")}<span>${esc(y.v[0].d)}</span></div></div></div>`).join("");
  $("#dbody").innerHTML = `
    ${d.img ? `<img src="${esc(d.img.replace('w=400&h=400','w=1000&h=1000'))}" alt="" style="width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:12px;margin-bottom:12px;background:#e5e7eb">` : ""}
    <div class="dn">${esc(d.n)}</div>
    <div class="dcat">${esc(d.cat)} · ${esc(d.pr)}${dist}</div>
    <div class="badges">${mBadge(d.g, " · 2026")}${d.green?`<span class="badge" style="--c:#2f9e44">그린 스타</span>`:""}</div>
    <div class="sec"><h3>미쉐린 인스펙터 평</h3><div class="mainmenu" style="font-size:14px;font-weight:500;line-height:1.6;background:#f8f9fa;color:#1f2937">${esc(d.desc || "-")}</div></div>
    <div class="sec"><h3>매장 정보</h3><div class="info">${rows.map(r => `<div class="k">${r[0]}</div><div>${r[1]}</div>`).join("")}</div></div>
    <div class="sec"><h3>길찾기 · 상세</h3><div class="links">
      <a style="background:#FEE500;color:#191919" href="${route}" target="_blank">카카오 길찾기</a>
      <a style="background:#BA0C2F" href="${esc(d.url)}" target="_blank">미쉐린 가이드</a>
      <a style="background:#03C75A" href="https://map.naver.com/p/search/${q}" target="_blank">네이버지도</a></div></div>
    ${yts ? `<div class="sec"><h3>이 식당을 소개한 유튜버 영상</h3><div id="ytrel">${yts}</div></div>` : ""}
    <div class="note">출처: 미쉐린 가이드 서울 & 부산 2026 공식 웹사이트. 영업시간은 변동될 수 있으니 방문 전 확인하세요.</div>`;
  const rel = $("#ytrel"); if (rel) rel.onclick = e => { const it = e.target.closest(".item"); if (it) openDetail(+it.dataset.i); };
}
function openDetail(i){
  const d = BYI[i]; state.sel = i;
  if (d.src === "mic"){ openMic(d); $("#detail").classList.add("open"); $("#dbody").scrollTop = 0; if (map && d.lat){ if (map.getLevel() > 4) map.setLevel(4); map.panTo(LL(d.lat,d.lon)); } return; }
  $("#dttl").textContent = d.n;
  const bs = chOf(d).map(c => `<a class="badge" style="--c:${CH[c].color};text-decoration:none" href="${CH[c].url}" target="_blank">${esc(CH[c].name)} · 구독 ${CH[c].subs}</a>`).join("");
  const dist = state.me && d.lat ? ` · 내 위치에서 ${fmtD(hav(state.me.lat,state.me.lon,d.lat,d.lon))}` : "";
  const menu = d.menu.length ? `<table class="menu">${d.menu.map(m => `<tr><td>${esc(m[0])}</td><td class="p">${esc(m[1]||"")}</td></tr>`).join("")}</table>` : `<div style="font-size:13px;color:#6b7280">영상 설명에 가격 정보가 없습니다.</div>`;
  const rows = [["주소", d.a ? esc(d.a) : ""], ["전화", d.ph ? `<a href="tel:${esc(d.ph)}">${esc(d.ph)}</a>` : ""], ["영업시간", esc(d.h)], ["휴무", esc(d.cl)], ["주차", esc(d.pk)]].filter(r => r[1]);
  const vids = d.v.map(v => {
    const t = v.s ? `&t=${v.s}s` : "";
    return `<div class="vcard"><a class="thumb" href="https://www.youtube.com/watch?v=${v.id}${t}" target="_blank"><img src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt=""><span class="play"></span></a>
      <div class="vb"><div class="vt">${esc(v.t)}</div><div class="vm"><span class="badge" style="--c:${CH[v.c].color}">${esc(CH[v.c].name)}</span>${esc(v.d)}${v.s?` · ${Math.floor(v.s/60)}분 ${v.s%60}초부터`:""}</div><div class="vi">${esc(v.in)}</div></div></div>`;
  }).join("");
  const nm = d.n.replace(/\(.*?\)/g,"").trim();
  const q = encodeURIComponent(nm + " " + shortArea(d));
  const route = d.kid ? `https://map.kakao.com/link/to/${d.kid}` : (d.lat ? `https://map.kakao.com/link/to/${encodeURIComponent(nm)},${d.lat},${d.lon}` : `https://map.kakao.com/?q=${q}`);
  const links = `<div class="links">
    <a style="background:#FEE500;color:#191919" href="${route}" target="_blank">카카오 길찾기</a>
    <a style="background:#2563eb" href="${d.kid?`https://place.map.kakao.com/${d.kid}`:`https://map.kakao.com/?q=${q}`}" target="_blank">카카오 상세</a>
    <a style="background:#03C75A" href="https://map.naver.com/p/search/${q}" target="_blank">네이버지도</a></div>`;
  const warn = d.geo === "approx" ? `<div class="note" style="color:#b45309">※ 영상에서 상호/주소가 확인되지 않아 동네·시장 기준 대략 위치에 표시했습니다.</div>` : d.geo === "none" ? `<div class="note" style="color:#b45309">※ 위치를 확인하지 못해 지도에 표시되지 않습니다.</div>` : (d.v.every(v => v.cf === "low") ? `<div class="note" style="color:#b45309">※ 상호명을 자막에서 추정했습니다. 방문 전 영상으로 확인해 주세요.</div>` : "");
  const micNote = d.mic ? `<div class="sec"><div class="item" data-i="${d.mic}" id="micrel" style="border:1px solid #e5e7eb;border-radius:10px;padding:8px"><img src="${esc(BYI[d.mic].img)}" alt=""><div class="b"><div class="nm">미쉐린 가이드 2026 등재</div><div class="meta">${mBadge(BYI[d.mic].g)}<span>인스펙터 평 보기 ›</span></div></div></div></div>` : "";
  $("#dbody").innerHTML = `
    <div class="dn">${esc(d.n)}</div>
    <div class="dcat">${esc(d.cat || "")}${dist}</div>
    <div class="badges">${bs}${d.mic ? mBadge(BYI[d.mic].g) : ""}</div>
    ${micNote}
    ${warn}
    <div class="sec"><h3>대표 메뉴</h3><div class="mainmenu">${esc(d.mm || "-")}</div></div>
    <div class="sec"><h3>메뉴 · 가격 (영상 기준)</h3>${menu}</div>
    <div class="sec"><h3>매장 정보</h3><div class="info">${rows.map(r => `<div class="k">${r[0]}</div><div>${r[1]}</div>`).join("")}</div></div>
    <div class="sec"><h3>길찾기 · 상세</h3>${links}</div>
    <div class="sec"><h3>소개 영상 ${d.v.length > 1 ? `(${d.v.length}편)` : ""}</h3>${vids}</div>
    <div class="note">메뉴·가격·영업시간은 영상 업로드 시점 기준입니다. 방문 전 지도앱에서 최신 정보를 확인하세요. 데이터 기준일 ${BUILT}.</div>`;
  const mr = $("#micrel"); if (mr) mr.onclick = () => openDetail(d.mic);
  $("#detail").classList.add("open");
  $("#dbody").scrollTop = 0;
  if (map && d.lat){ if (map.getLevel() > 4) map.setLevel(4); map.panTo(LL(d.lat,d.lon)); }
}
$("#backBtn").onclick = () => $("#detail").classList.remove("open");
$("#list").onclick = e => { const it = e.target.closest(".item"); if (it) openDetail(+it.dataset.i); };
$("#handle").onclick = () => { const s=$("#sheet"); if (s.classList.contains("full")) { s.classList.remove("full"); s.classList.add("min"); } else if (s.classList.contains("min")) s.classList.remove("min"); else s.classList.add("full"); };
let qt; $("#q").oninput = e => { clearTimeout(qt); qt = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); refresh(); if (state.q) fitAll(); }, 200); };
$("#fitBtn").onclick = () => { state.radius = 0; state.me = null; $("#nearBtn").classList.remove("on"); if (meCircle) { meCircle.setMap(null); meCircle = null; } buildRadius(); refresh(); fitAll(); };

const RADII = [[0,"전체"],[500,"500m"],[1000,"1km"],[3000,"3km"],[5000,"5km"]];
function buildRadius(){
  const el=$("#radius"); el.style.display = state.me ? "block" : "none";
  el.innerHTML = RADII.map(([r,l]) => `<button data-r="${r}" class="${state.radius===r?"sel":""}">${l}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => { state.radius = +b.dataset.r; buildRadius(); drawMe(); refresh(); });
}
function drawMe(){
  if (!map || !state.me) return;
  const p = LL(state.me.lat, state.me.lon);
  if (!meMarker) meMarker = new kakao.maps.Marker({ map, position: p, zIndex: 9999, image: new kakao.maps.MarkerImage(meSvg(), new kakao.maps.Size(24,24), { offset: new kakao.maps.Point(12,12) }) });
  else { meMarker.setPosition(p); meMarker.setMap(map); }
  if (meCircle) meCircle.setMap(null);
  meCircle = null;
  if (state.radius){
    meCircle = new kakao.maps.Circle({ map, center: p, radius: state.radius, strokeWeight: 1.5, strokeColor: "#2563eb", strokeOpacity: .6, fillColor: "#2563eb", fillOpacity: .06 });
    map.setBounds(meCircle.getBounds(), 20, 20, 20, 20);
  } else { map.setLevel(4); map.panTo(p); }
}
$("#nearBtn").onclick = () => {
  if (!navigator.geolocation) return toast("이 브라우저는 위치 기능을 지원하지 않습니다.");
  toast("현재 위치 확인 중...");
  navigator.geolocation.getCurrentPosition(pos => {
    state.me = { lat: pos.coords.latitude, lon: pos.coords.longitude };
    if (!state.radius) state.radius = 3000;
    $("#nearBtn").classList.add("on"); buildRadius(); drawMe(); refresh();
    $("#sheet").classList.remove("min");
    const n = visible().length; toast(n ? `${fmtD(state.radius)} 안에 ${n}곳` : `${fmtD(state.radius)} 안에 맛집이 없어요. 반경을 넓혀보세요.`);
  }, err => toast(location.protocol === "https:" ? "위치 권한이 필요합니다. 브라우저 설정에서 허용해 주세요." : "내 주변 기능은 https 주소(깃허브 페이지)에서 열어야 동작합니다.", 3500), { enableHighAccuracy:true, timeout:10000, maximumAge:60000 });
};

buildChips(); renderList();
const sc = document.createElement("script");
sc.src = "https://dapi.kakao.com/v2/maps/sdk.js?autoload=false&appkey=" + KAKAO_KEY;
sc.onload = () => { try { kakao.maps.load(initMap); } catch(e) { toast("카카오 지도 초기화 실패: " + e.message, 5000); } };
sc.onerror = () => toast("카카오 지도를 불러오지 못했습니다. 카카오 개발자 콘솔의 'JavaScript SDK 도메인'에 이 주소가 등록됐는지 확인하세요.", 6000);
document.head.appendChild(sc);
</script>
